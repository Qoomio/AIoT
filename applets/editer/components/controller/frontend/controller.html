<div class="header-actions">
    <!-- Left section: Explorer button -->
    <div class="left-section">
        <button id="toggle-explorer" class="panel-toggle-btn" title="Show Explorer Panel">
            <span class="btn-icon btn-icon-spaced"><img src="/view/applets/editer/frontend/icons/explorer.svg" alt="" class="btn-icon-img"></span><span class="btn-text"> Explorer</span>
        </button>
    </div>
    
    <!-- Center section: Layout controls, Settings button, and Save button -->
    <div class="center-section">
        <div class="layout-controls">
            <button id="layout-single" class="layout-btn active" title="Single Editor">☐</button>
            <button id="layout-vertical" class="layout-btn" title="Split Vertical">◫</button>
            <button id="layout-horizontal" class="layout-btn" title="Split Horizontal">⊟</button>
            <button id="layout-quad" class="layout-btn" title="Quad Split">⊞</button>
        </div>
        
        <button id="monaco-settings-button" class="settings-btn" title="Monaco Editor Settings">
            <span class="btn-icon btn-icon-spaced"><img src="/view/applets/editer/frontend/icons/settings.svg" alt="" class="btn-icon-img"></span><span class="btn-text"> Settings</span>
        </button>
        
        <button id="update-button" class="update-btn" title="Update & Restart">
            <span class="btn-icon btn-icon-spaced"><img src="/view/applets/editer/frontend/icons/refresh.svg" alt="" class="btn-icon-img"></span><span class="btn-text"> Update</span>
        </button>
        
        <button id="save-button" class="save-btn" title="Save File (Ctrl+S)" disabled>
            <span class="btn-icon btn-icon-spaced"><img src="/view/applets/editer/frontend/icons/save.svg" alt="" class="btn-icon-img"></span><span class="btn-text"> Save</span>
        </button>
    </div>
    
    <!-- Right section: Preview button -->
    <div class="right-section">
        <button id="toggle-preview" class="panel-toggle-btn" title="Show Preview Panel">
            <span class="btn-icon btn-icon-spaced btn-icon-match-color btn-icon-preview" aria-hidden="true"></span><span class="btn-text"> Preview</span>
        </button>
        <button id="toggle-chat" class="panel-toggle-btn" title="Show Chat Panel">
            <span class="btn-icon btn-icon-spaced btn-icon-match-color btn-icon-chat" aria-hidden="true"></span><span class="btn-text"> Chat</span>
        </button>
    </div>
</div>

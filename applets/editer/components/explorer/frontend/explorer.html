<div class="file-explorer">
  <div class="explorer-header">
    <h3 class="explorer-title">Explorer</h3>
    <div class="explorer-actions">
      <button class="explorer-search-btn" id="explorer-search-btn" title="Search in Explorer">🔍</button>
      <button class="new-file-btn explorer-tab-only" data-tab="explorer" title="New File">📄</button>
      <button class="new-folder-btn explorer-tab-only" data-tab="explorer" title="New Folder">📁</button>
      <button class="refresh-btn explorer-tab-only" data-tab="explorer" title="Refresh">🔄</button>
    </div>
  </div>

  <!-- Explorer View -->
  <div class="explorer-content active" id="explorer-view">
    <div class="file-tree-container" id="file-tree-container">
      <ul class="file-tree" id="file-tree">
        <!-- File tree will be dynamically populated -->
      </ul>
    </div>
  </div>

  <!-- Search View -->
  <div class="explorer-search-content" id="explorer-search-view">
    <div class="search-tab-container">
      <div class="search-form">
        <div class="search-input-group">
          <input
            type="text"
            class="search-input"
            placeholder="Search text..."
          />
          <button
            class="search-options-btn"
            title="Search Options"
          >⚙️</button>
        </div>

        <div class="search-input-group">
          <input
            type="text"
            class="replace-input"
            placeholder="Replace with..."
          />
        </div>

        <div class="search-options">
          <label class="search-option">
            <input type="checkbox" class="case-sensitive" />
            Case sensitive
          </label>
          <label class="search-option">
            <input type="checkbox" class="whole-word" />
            Whole word
          </label>
          <label class="search-option">
            <input type="checkbox" class="regex" />
            Regular expression
          </label>
          <div class="search-filter-group">
            <label for="file-filter">Files to include:</label>
            <input
              type="text"
              id="file-filter"
              class="file-filter"
              placeholder="*.js, *.html, *.css"
            />
          </div>
          <div class="search-filter-group">
            <label for="exclude-filter">Files to exclude:</label>
            <input
              type="text"
              id="exclude-filter"
              class="exclude-filter"
              placeholder="node_modules, .git"
            />
          </div>
        </div>

        <div class="search-actions">
          <button class="search-btn">Search</button>
          <button class="replace-btn" disabled>Replace</button>
          <button class="replace-all-btn" disabled>Replace All</button>
        </div>
      </div>

      <div class="search-results">
        <div class="search-status">Enter search term to begin</div>
        <div class="results-list">
          <!-- Search results will be populated here -->
        </div>
      </div>
    </div>
  </div>

<div id="create-file-modal" class="modal" style="display: none;">
  <div class="create-file-modal-content">
    <div class="create-file-modal-header">
      <h3>Create New File</h3>
      <button type="button" id="create-file-close" class="create-file-close-btn" aria-label="Close">
        <img src="/view/applets/publisher/assets/ab1d94399957e76f55573113ee2b580c751a8270.svg" alt="" />
      </button>
    </div>
    <div class="create-file-modal-body">
      <div class="create-file-field">
        <label for="file-name" class="create-file-label">File Name</label>
        <input
          type="text"
          id="file-name"
          class="create-file-input"
          placeholder="Enter file name (e.g., script.js, index.html)"
        />
      </div>
      <div class="create-file-field">
        <label for="file-template" class="create-file-label">Template (optional)</label>
        <div class="create-file-select-wrap">
          <select id="file-template" class="create-file-select">
            <option value="">No template</option>
            <option value="html">HTML Template</option>
            <option value="css">CSS Template</option>
            <option value="javascript">JavaScript Template</option>
            <option value="json">JSON Template</option>
            <option value="markdown">Markdown Template</option>
            <option value="node-module">Node.js Module Template</option>
            <option value="test">Test File Template</option>
          </select>
          <img class="create-file-select-icon" src="/view/applets/publisher/assets/565cef13462393062c83d6e2bf3d9db43136a820.svg" alt="" />
        </div>
      </div>
      <div class="create-file-field">
        <label for="file-content" class="create-file-label">Initial Content</label>
        <textarea
          id="file-content"
          class="create-file-textarea"
          placeholder="Enter initial content (optional)"
        ></textarea>
      </div>
    </div>
    <div class="create-file-modal-footer">
      <button id="create-file-cancel" class="create-file-btn create-file-btn-secondary">
        Cancel
      </button>
      <button id="create-file-submit" class="create-file-btn create-file-btn-primary">
        Create File
      </button>
    </div>
  </div>
</div>

<!DOCTYPE html>
<html>
    <head>
        <title>Image Viewer</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                width: 100vw;
                background-color: #1e1e1e;
                overflow: hidden;
            }
            img {
                max-width: 95%;
                max-height: 95%;
                width: auto;
                height: auto;
                object-fit: contain;
            }
        </style>
        <link rel="stylesheet" href="/view/applets/renderer/frontend/refresh.css">
    </head>
    <body>
        <img src="{{IMAGE_URL}}" alt="Image" onerror="this.onerror=null; document.body.innerHTML='<p style=color:red;text-align:center;margin-top:50px>Failed to load image</p>';" />
        <script type="module">
            import { initAutoRefresh } from '/view/applets/renderer/frontend/lib/auto-refresh.js';
            initAutoRefresh('{{FILE_PATH}}');
        </script>
    </body>
</html>
